name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runs on the same ref queue (up to 100) instead of cancelling, so no deploy
# is cut off mid-upload. GitHub's default single pending slot could instead
# replace the newest main push with an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run build

      # Only pushes to main reach this step; PR runs, including forks, never see the secrets.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # pipefail, so a failing ls-remote cannot hide behind cut.
        shell: bash
        run: |
          # A re-run of an older main run must not replace a newer production deploy.
          head="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          test -n "$head"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is at $head; skipping the deploy of $GITHUB_SHA."
            exit 0
          fi
          bunx wrangler pages deploy --branch main --commit-hash "$GITHUB_SHA"
